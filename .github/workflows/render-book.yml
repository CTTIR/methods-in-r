name: Render and deploy book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Apt deps for PDF checks (poppler headers + python)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpoppler-cpp-dev python3-pip

      - name: Python deps for PDF checks
        run: pip install --break-system-packages --user pypdf

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            bookdown
            rmarkdown
            knitr
            sessioninfo
            bslib
            downlit
            xml2
            htmltools
            tinytex
            pdftools
            qpdf

      - name: Install TinyTeX (TinyTeX-2 bundle — includes hyperref + common packages)
        run: Rscript -e 'tinytex::install_tinytex(force = TRUE, bundle = "TinyTeX-2")'

      - name: Top up LaTeX packages used by our preamble
        run: |
          Rscript -e 'tinytex::tlmgr_install(c(
            "hyperref","xcolor","microtype","booktabs","longtable","float",
            "fontspec","unicode-math","tipa","tex-gyre","amsmath","mathtools",
            "etoolbox","iftex","l3backend","l3kernel","l3packages","fancyvrb",
            "framed","ulem","upquote","url","koma-script","caption","listings",
            "textcomp","geometry","setspace","titling","environ","pdftexcmds",
            "infwarerr","kvoptions","ltxcmds","epstopdf-pkg","colortbl","array",
            "multirow","wrapfig","threeparttable","threeparttablex","makecell",
            "ragged2e","filehook","newunicodechar","dejavu","seqsplit","fvextra","fancyhdr","xurl"
          ))'

      - name: Check lab source integrity
        run: |
          python3 -m unittest discover -s tests
          python3 scripts/check-lab-code.py

      - name: Refresh source dates
        run: python3 scripts/update-page-provenance.py

      - name: Check PDF symbol coverage
        run: Rscript tests/check-pdf-fonts.R

      - name: Render HTML (bs4_book)
        run: Rscript -e 'bookdown::render_book("index.Rmd", output_format = "bookdown::bs4_book")'

      - name: Render EPUB
        id: epub
        run: Rscript -e 'bookdown::render_book("index.Rmd", output_format = "bookdown::epub_book")'

      - name: Finalize EPUB navigation and citation attachments
        if: steps.epub.outcome == 'success'
        run: python3 scripts/finalize-epub.py

      - name: Render PDF
        run: Rscript -e 'bookdown::render_book("index.Rmd", output_format = "bookdown::pdf_book")'

      # The LaTeX source is a build intermediate, not a published download.
      - name: Keep the LaTeX source off the site
        run: find docs -name '*.tex' -print -delete

      - name: Inventory available downloads
        run: python3 scripts/build-download-manifest.py

      - name: Check rendered navigation
        run: python3 scripts/check-html-links.py docs /tmp/methods-links.json

      - name: Verify page notes and downloadable formats
        run: |
          python3 tests/test_page_provenance.py
          python3 tests/test_book_delivery.py
          python3 scripts/finalize-book.py docs
          python3 scripts/check-book.py docs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify every book and chapter download
        run: bash scripts/build-downloads-ci.sh docs methods-in-r https://cttir.github.io/methods-in-r/

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
