<!-- Dark / light mode toggle (replaces Harrer's emoji with a Font Awesome glyph) -->
<div class="sticky-item">
  <button type="button" id="mode-switch" class="btn-circle-mode" aria-label="Toggle dark mode">
    <i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>
  </button>
</div>

<script>
  (function () {
    var stored = localStorage.getItem('themeMode');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var initial = stored || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', initial);

    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.getElementById('mode-switch');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var current = document.documentElement.getAttribute('data-theme');
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('themeMode', next);
      });
    });
  })();
</script>

<!-- Offer only downloads produced and inventoried by this build. -->
<script>
  document.addEventListener("DOMContentLoaded", async function () {
    var source = document.getElementById("book-source");
    var extra = source && source.closest(".book-extra");
    if (!extra) return;
    try {
      var response = await fetch("downloads.json");
      if (!response.ok) return;
      var files = await response.json();
      // Chapter downloads come from the shared panel under each chapter title.
      var candidates = [
        ["methods-in-r.pdf", "Entire book (PDF)"],
        ["methods-in-r.epub", "Entire book (EPUB)"]
      ];
      var available = candidates.filter(function (item) { return files.includes(item[0]); });
      if (!available.length) return;
      var wrap = document.createElement("div");
      wrap.className = "book-downloads";
      var heading = document.createElement("h6");
      heading.textContent = "Downloads";
      wrap.appendChild(heading);
      var list = document.createElement("ul");
      list.className = "list-unstyled";
      available.forEach(function (item) {
        var li = document.createElement("li");
        var link = document.createElement("a");
        link.href = item[0]; link.textContent = item[1];
        li.appendChild(link); list.appendChild(li);
      });
      wrap.appendChild(list);
      extra.parentNode.insertBefore(wrap, extra);
    } catch (error) {
      // An unavailable inventory means there are no verified download links.
    }
  });
</script>
